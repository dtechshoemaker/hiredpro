databases:
  - name: hiredpro-db
    plan: free
    databaseName: hiredpro
    user: hiredpro

services:
  - type: web
    name: hiredpro
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn resumeai_django.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hiredpro-db
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: DATABASE_SSL_REQUIRE
        value: true
      - key: CORS_ALLOW_ALL_ORIGINS
        value: false
